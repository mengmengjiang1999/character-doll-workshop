<text x="236" y="120" font-family="Arial, sans-serif" font-size="2.5" font-weight="normal" fill="#687985">B: return fold / G: grain</text>
<text x="236" y="126" font-family="Arial, sans-serif" font-size="2.5" font-weight="normal" fill="#b54343">Do not sew vertical folds.</text>
<text x="236" y="132" font-family="Arial, sans-serif" font-size="2.5" font-weight="normal" fill="#17242d">SA: 3 mm all edges</text>
<text x="236" y="138" font-family="Arial, sans-serif" font-size="2.5" font-weight="normal" fill="#687985">Hem band guide: 8 mm</text>
<text x="236" y="144" font-family="Arial, sans-serif" font-size="2.5" font-weight="normal" fill="#17242d">Black: cut / blue: seam</text>
<text x="12" y="167" font-family="Arial, sans-serif" font-size="2.8" font-weight="bold" fill="#17242d">Each panel: flat waist 204.0 -&gt; folded 68.0. Two panels = 136.0 finished waist.</text>
<text x="12" y="175" font-family="Arial, sans-serif" font-size="2.7" font-weight="normal" fill="#17242d">Each repeat: 51.0 -&gt; 17.0. Baste pleats at waist only. Open CB for first 40 mm.</text>
<text x="12" y="183" font-family="Arial, sans-serif" font-size="2.6" font-weight="normal" fill="#17242d">Arrange left/right halves with CF touching CF and CB touching CB; they may be folded in mirrored directions.</text>
