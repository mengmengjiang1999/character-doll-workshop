<g transform="translate(90,0) scale(-1,1)"><path d="M5,0 H85 L70,110 L7,87 Z" fill="#3C578D"/><path d="M73,0 L60.5,96 L7,77" fill="none" stroke="#FAF9F6" stroke-width="2.7"/><path d="M66,0 L54.5,87 L7,69" fill="none" stroke="#FAF9F6" stroke-width="2.7"/></g>
