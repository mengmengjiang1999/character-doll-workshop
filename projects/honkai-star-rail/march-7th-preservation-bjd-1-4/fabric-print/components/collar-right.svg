<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="90mm" height="110mm" viewBox="0 0 90 110">
<title>collar-right</title>
<desc>Editable textile artwork, millimetres; draft color and placement proof, no cut or seam lines.</desc>
<defs>
