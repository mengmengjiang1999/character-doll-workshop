<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400mm" height="500mm" viewBox="0 0 400 500">
<title>March 7th Preservation textile color-placement proof v0.1</title>
<desc>Editable textile artwork, millimetres; draft color and placement proof, no cut or seam lines.</desc>
<defs>
<linearGradient id="jacketGradient" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0" stop-color="#C98DD4"/><stop offset="0.12" stop-color="#BF95DC"/>
 <stop offset="0.57" stop-color="#87ADE0"/><stop offset="1" stop-color="#87ADE0"/>
</linearGradient>
<linearGradient id="ribbonGradient" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0" stop-color="#72CEE3"/><stop offset="0.28" stop-color="#84C9E8"/>
 <stop offset="0.62" stop-color="#AABCEC"/><stop offset="0.9" stop-color="#EDB7F1"/>
 <stop offset="1" stop-color="#F0B8F2"/>
</linearGradient>
<linearGradient id="beltGradient" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0" stop-color="#B8A2DA"/><stop offset="0.5" stop-color="#C3B6E7"/>
 <stop offset="1" stop-color="#ACA3D8"/>
</linearGradient>
<g id="diamondMotif">
 <path d="M0,-6 L4.1,0 L0,6 L-4.1,0 Z" fill="#E7E8F7"/>
 <path d="M0,-6 L0,0 L-4.1,0 Z" fill="#F5C9F1"/>
 <path d="M0,-6 L4.1,0 L0,0 Z" fill="#F7F8FC"/>
 <path d="M-4.1,0 L0,0 L0,6 Z" fill="#84D7E8"/>
 <path d="M0,0 L4.1,0 L0,6 Z" fill="#B6B8E7"/>
</g>
<path id="fourPetalOutline" d="M0,-20 C9,-20 12,-13 8,-8 C13,-12 20,-9 20,0 C20,9 13,12 8,8 C12,13 9,20 0,20 C-9,20 -12,13 -8,8 C-13,12 -20,9 -20,0 C-20,-9 -13,-12 -8,-8 C-12,-13 -9,-20 0,-20 Z"/>
<g id="coloredFlower">
 <g id="coloredWhitePetal" fill="#FAF9F6">
  <path d="M0,1 C-7,-2 -9,-10 -5,-16 C-3,-19 0,-21 0,-21 C3,-19 7,-15 7,-11 C7,-6 4,-2 0,1 Z"/>
 </g>
 <use xlink:href="#coloredWhitePetal" transform="rotate(90)"/>
 <use xlink:href="#coloredWhitePetal" transform="rotate(180)"/>
 <use xlink:href="#coloredWhitePetal" transform="rotate(270)"/>
 <g fill="#E996D1">
  <ellipse cx="0" cy="-10.2" rx="2.8" ry="7.8"/><ellipse cx="10.2" cy="0" rx="7.8" ry="2.8"/>
  <ellipse cx="0" cy="10.2" rx="2.8" ry="7.8"/><ellipse cx="-10.2" cy="0" rx="7.8" ry="2.8"/>
 </g>
 <g fill="#82DFEF">
  <ellipse cx="0" cy="-9.5" rx="1.65" ry="6.4"/><ellipse cx="9.5" cy="0" rx="6.4" ry="1.65"/>
  <ellipse cx="0" cy="9.5" rx="1.65" ry="6.4"/><ellipse cx="-9.5" cy="0" rx="6.4" ry="1.65"/>
 </g>
 <circle r="2.1" fill="#FAF9F6"/>
</g>
<g id="outlineFlower">
 <use xlink:href="#fourPetalOutline" fill="none" stroke="#FAF9F6" stroke-width="3.1"/>
 <use xlink:href="#fourPetalOutline" transform="scale(.63)" fill="none" stroke="#FAF9F6" stroke-width="2.2"/>
 <circle r="2.4" fill="#FAF9F6"/>
</g>
</defs>
<rect width="400" height="500" fill="#FFFFFF"/>
<g id="skirt-border-panel" transform="translate(20,18)"><rect width="360" height="100" fill="#334D83"/><rect y="77" width="360" height="1.7" fill="#FAF9F6"/><rect y="83" width="360" height="17" fill="#FAF9F6"/><use xlink:href="#diamondMotif" transform="translate(26,67)"/><use xlink:href="#diamondMotif" transform="translate(89,67)"/><use xlink:href="#diamondMotif" transform="translate(152,67)"/><use xlink:href="#diamondMotif" transform="translate(215,67)"/><use xlink:href="#diamondMotif" transform="translate(278,67)"/><use xlink:href="#outlineFlower" transform="translate(334,65) scale(.48)"/></g>
<g id="collar-left" transform="translate(20,138)"><path d="M5,0 H85 L70,110 L7,87 Z" fill="#3C578D"/><path d="M73,0 L60.5,96 L7,77" fill="none" stroke="#FAF9F6" stroke-width="2.7"/><path d="M66,0 L54.5,87 L7,69" fill="none" stroke="#FAF9F6" stroke-width="2.7"/></g>
<g id="collar-right" transform="translate(120,138)"><g transform="translate(90,0) scale(-1,1)"><path d="M5,0 H85 L70,110 L7,87 Z" fill="#3C578D"/><path d="M73,0 L60.5,96 L7,77" fill="none" stroke="#FAF9F6" stroke-width="2.7"/><path d="M66,0 L54.5,87 L7,69" fill="none" stroke="#FAF9F6" stroke-width="2.7"/></g></g>
<g id="jacket-gradient-field" transform="translate(220,138)"><rect width="160" height="110" fill="url(#jacketGradient)"/></g>
<g id="back-ribbon-left" transform="translate(20,267)"><path d="M7,0 H68 C72,42 55,103 31,140 C8,99 0,45 7,0 Z" fill="url(#ribbonGradient)"/></g>
<g id="back-ribbon-right" transform="translate(110,267)"><g transform="translate(75,0) scale(-1,1)"><path d="M7,0 H68 C72,42 55,103 31,140 C8,99 0,45 7,0 Z" fill="url(#ribbonGradient)"/></g></g>
<g id="waist-panel-left" transform="translate(210,267)"><path d="M2,0 H83 V63 C83,90 54,103 6,120 L2,77 Z" fill="#454143"/><path d="M78,0 V62 C78,86 51,99 6,114" fill="none" stroke="#D8C9A5" stroke-width="1.8"/><path d="M74,0 V62 C74,83 50,96 6,110" fill="none" stroke="#26262B" stroke-width=".7"/></g>
<g id="waist-panel-right" transform="translate(305,267)"><g transform="translate(85,0) scale(-1,1)"><path d="M2,0 H83 V63 C83,90 54,103 6,120 L2,77 Z" fill="#454143"/><path d="M78,0 V62 C78,86 51,99 6,114" fill="none" stroke="#D8C9A5" stroke-width="1.8"/><path d="M74,0 V62 C74,83 50,96 6,110" fill="none" stroke="#26262B" stroke-width=".7"/></g></g>
<g id="colored-four-petal-badge" transform="translate(20,430)"><use xlink:href="#coloredFlower" transform="translate(22,22)"/></g>
<g id="white-four-petal-badge" transform="translate(80,430)"><rect width="44" height="44" fill="#334D83"/><use xlink:href="#outlineFlower" transform="translate(22,22) scale(.9)"/></g>
<g id="cuff-stripe-field" transform="translate(220,407)"><rect width="160" height="28" fill="#FAF9F6"/><rect y="18" width="160" height="2.1" fill="#334D83"/></g>
<g id="lilac-belt-field" transform="translate(170,458)"><rect width="180" height="16" fill="url(#beltGradient)"/><path d="M0,2 H180 M0,14 H180" fill="none" stroke="#5F558B" stroke-width=".6"/></g>

</svg>
